# LinuxDesk build settings.
#
# The values are deliberately modest: the reference machine for this project
# has 2 GB of RAM and 2 cores, so the build must fit in a small heap and
# must not fork extra daemons.
org.gradle.jvmargs=-Xmx820m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
